services:
  - type: web
    name: study-abroad-app
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: study-abroad-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: study-abroad-app
          property: url
      - key: FRONTEND_DIST
        value: /app/backend/frontend_dist

databases:
  - name: study-abroad-db
    plan: free
